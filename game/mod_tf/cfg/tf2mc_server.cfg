// TF2MC server settings - exec from server.cfg or the console before loading mc_world
mc_host "127.0.0.1"        // where the Minecraft server with tf2bridge runs
mc_port 25599
mc_public_host ""          // address remote clients use to reach the bridge (empty = mc_host)
mc_autoconnect 1
mc_scale 46                // Hammer units per block (46: TF2 players are ~1.8 blocks tall, like Steve)
mc_narrow_hull 1           // Minecraft-width player hull so 1-block doorways fit
mc_origin_y 128            // Minecraft Y at Source z=0
mc_damage_to_mc 0.08       // TF2 damage -> Minecraft health points
mc_jump_assist 1           // TF classes can hop one block
mc_allow_steve 1           // allow the Minecraft-mode player ("mc_steve")
mc_rebase_distance 96      // floating origin: re-centre when a player is this far (blocks) from it
mc_border_units 15360      // soft border only when players are too far apart to share one map
mc_respawn_near_team 1     // respawn next to a living teammate
mc_tf_explosions 1         // rockets/stickies carve small craters (0 = off)
mc_sentries_target_mobs 1
mc_food_heal 4             // TF2 health per Minecraft hunger point eaten
mc_chat_bridge 1
mp_timelimit 0
mp_disable_respawn_times 1
tf_allow_player_use 1
