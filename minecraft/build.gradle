plugins {
    // Minecraft 26.x is unobfuscated: use the non-remapping Loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // No Fabric API dependency: all hooks are mixins.
}

// src/test/java holds FakeWorldServer, a protocol-only stand-in for Minecraft (run with
// `gradle fakeWorld`), not unit tests. Gradle 9 fails a test task that finds no tests, so allow it.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

tasks.register('fakeWorld', JavaExec) {
    group = 'tf2mc'
    description = 'Runs the standalone fake Minecraft world for testing the TF2 side'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.tf2mc.bridge.FakeWorldServer'
    args = ['25599']
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
